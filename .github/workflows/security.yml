name: Security audit
on:
  push:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  pull_request:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"

jobs:
  security_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Install a modern toolchain for cargo-audit only. The repo's
      # rust-toolchain.toml pins nightly-2024-11-06 (rustc 1.84), but
      # cargo-audit >=0.22 requires rustc 1.88+ and can parse current
      # advisory-db entries (e.g. CVSS 4.0).
      - uses: dtolnay/rust-toolchain@7ba5d857b13a2c335579877a00c25c134410d383 # nightly
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: RUSTUP_TOOLCHAIN=stable cargo install cargo-audit --locked
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
